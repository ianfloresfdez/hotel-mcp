[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-mcp"
version = "0.1.0"
description = "A small hotel booking system with a front-desk web app and an MCP server for AI assistants."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ian Flores" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hotel-mcp = "hotel.mcp_server:main"
hotel-web = "hotel.web:main"

[tool.setuptools]
packages = ["hotel"]

[tool.setuptools.package-data]
hotel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
